<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pexo Skill Pipeline Map</title>
<style>
:root{--bg:#070b16;--panel:rgba(17,24,43,.92);--panel2:rgba(25,35,58,.95);--line:rgba(151,170,205,.18);--text:#edf4ff;--muted:#9dafcf;--blue:#72b9ff;--cyan:#5ce4d4;--green:#72dc93;--yellow:#f4c865;--red:#ff7b86;--purple:#ad9cff;--orange:#f0a050;--pink:#ff8ec4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;color:var(--text);background:var(--bg);overflow:hidden;height:100vh;width:100vw}

.toolbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:10px;padding:10px 20px;background:rgba(7,11,22,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.toolbar h1{font-size:15px;font-weight:800;margin:0;background:linear-gradient(135deg,var(--cyan),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.toolbar .sub{font-size:11px;color:var(--muted);margin-left:4px}
.toolbar .spacer{flex:1}
.tb-btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.tb-btn:hover{background:rgba(255,255,255,.1)}
.tb-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(92,228,212,.08)}
.zoom-info{font-size:11px;color:var(--muted);font-weight:700;min-width:44px;text-align:center}

.canvas-wrap{position:fixed;top:48px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
.canvas-wrap.dragging{cursor:grabbing}
.canvas{transform-origin:0 0;will-change:transform;position:absolute;top:0;left:0}

.node{position:absolute;border:1.5px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 8px 40px rgba(0,0,0,.35);cursor:default;transition:box-shadow .2s,border-color .2s;overflow:hidden}
.node:hover{border-color:rgba(92,228,212,.3);box-shadow:0 12px 50px rgba(0,0,0,.4)}
.node-header{padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
.node-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.node-title{font-size:14px;font-weight:800;line-height:1.2}
.node-ver{font-size:10px;font-weight:700;color:var(--muted);margin-top:2px}
.node-desc{padding:0 16px 12px;font-size:11px;line-height:1.5;color:var(--muted)}

.node-section{border-top:1px solid var(--line);overflow:hidden}
.node-section-head{padding:9px 16px;display:flex;align-items:center;gap:7px;cursor:pointer;font-size:11px;font-weight:800;color:var(--blue);transition:background .15s;user-select:none}
.node-section-head:hover{background:rgba(114,185,255,.05)}
.node-section-head .arrow{transition:transform .2s;font-size:9px;color:var(--muted)}
.node-section-head .arrow.open{transform:rotate(90deg)}
.node-section-head .badge{margin-left:auto;border-radius:7px;padding:2px 7px;font-size:9px;font-weight:800;background:rgba(114,185,255,.1);color:var(--blue)}
.node-section-body{padding:0 16px 10px;font-size:11px;line-height:1.6;color:var(--text);display:none}
.node-section-body.open{display:block}

.tag{display:inline-block;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:750;margin:2px}
.tag.tool{background:rgba(244,200,101,.1);border:1px solid rgba(244,200,101,.2);color:var(--yellow)}
.tag.ref{background:rgba(114,185,255,.1);border:1px solid rgba(114,185,255,.2);color:var(--blue)}
.tag.model{background:rgba(173,156,255,.1);border:1px solid rgba(173,156,255,.2);color:var(--purple)}
.tag.handoff{background:rgba(92,228,212,.1);border:1px solid rgba(92,228,212,.2);color:var(--cyan)}
.tag.rule{background:rgba(255,142,196,.08);border:1px solid rgba(255,142,196,.18);color:var(--pink)}

.rule-item{padding:3px 0;border-bottom:1px solid rgba(151,170,205,.06)}
.rule-item:last-child{border-bottom:none}
.model-row{display:flex;gap:6px;align-items:flex-start;padding:3px 0;flex-wrap:wrap}
.model-row .model-when{color:var(--muted);font-size:10px}
.ref-row{padding:2px 0}
.ref-row code{font-size:10px;color:var(--cyan);background:rgba(92,228,212,.08);border-radius:4px;padding:1px 5px}
.ref-row .ref-note{color:var(--muted);font-size:10px;margin-left:2px}
.ref-row .exclusive{color:var(--pink);font-size:9px;font-weight:800}

svg.connectors{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}

.legend{position:fixed;bottom:14px;left:14px;z-index:100;display:flex;gap:6px;flex-wrap:wrap}
.legend .tag{font-size:9px;opacity:.85}

.phase-label{position:absolute;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;opacity:.5}
</style>
</head>
<body>

<div class="toolbar">
  <h1>Pexo Skill Pipeline Map</h1>
  <span class="sub">内容策略调用链路可视化</span>
  <div class="spacer"></div>
  <button class="tb-btn" onclick="expandAll()">展开全部</button>
  <button class="tb-btn" onclick="collapseAll()">收起全部</button>
  <span style="width:1px;height:20px;background:var(--line)"></span>
  <button class="tb-btn" onclick="zoomTo(.4)">40%</button>
  <button class="tb-btn" onclick="zoomTo(.65)">65%</button>
  <button class="tb-btn active" onclick="zoomTo(1)">100%</button>
  <button class="tb-btn" onclick="zoomTo(1.4)">140%</button>
  <span class="zoom-info" id="zoomInfo">100%</span>
  <button class="tb-btn" onclick="fitView()">适应窗口</button>
  <button class="tb-btn" onclick="resetView()">重置</button>
  <a href="/" class="tb-btn" style="text-decoration:none">← 返回诊断工具</a>
</div>

<div class="canvas-wrap" id="canvasWrap">
  <svg class="connectors" id="connectors" width="3000" height="1800"></svg>
  <div class="canvas" id="canvas"></div>
</div>

<div class="legend">
  <span class="tag tool">🔧 工具</span>
  <span class="tag ref">📄 Reference</span>
  <span class="tag model">🤖 模型</span>
  <span class="tag handoff">→ 交接</span>
  <span class="tag rule">📋 规则</span>
</div>

    references:[
      {file:'creation-faq.md', note:'创作能力 FAQ', exclusive:true},
      {file:'billing-faq.md', note:'积分/定价/订阅 FAQ', exclusive:true},
    ],
    models:[],
    rules:['不编造数字，不确定时优雅重定向'],
    handoffTo:[],
    handoffFrom:['用户提问'],
    input:'用户关于 Pexo 产品的问题',
    output:'产品信息回答',
    skipWhen:'无产品问题时不触发',
  },
];

const PIPELINE_ORDER = ['brainstorm','script','subject-asset','generation','assembly'];

const NODE_W = {
  brainstorm:280, script:340, 'subject-asset':280, generation:300, assembly:300,
  modification:280, publishing:260, 'image-production':260, 'product-knowledge':260,
};

const LAYOUT = {
  brainstorm:       {x:60,   y:100},
  script:           {x:420,  y:100},
  'subject-asset':  {x:840,  y:100},
  generation:       {x:1200, y:100},
  assembly:         {x:1580, y:100},
  modification:     {x:1200, y:700},
  publishing:       {x:1580, y:700},
  'image-production':{x:420, y:700},
  'product-knowledge':{x:60, y:700},
};

const canvas = document.getElementById('canvas');
const wrap = document.getElementById('canvasWrap');
const svg = document.getElementById('connectors');

let scale = 1, panX = 0, panY = 0;
let isDragging = false, dragStartX, dragStartY, panStartX, panStartY;

function applyTransform(){
  const t = `translate(${panX}px,${panY}px) scale(${scale})`;
  canvas.style.transform = t;
  svg.style.transform = t;
  document.getElementById('zoomInfo').textContent = Math.round(scale*100)+'%';
  document.querySelectorAll('.tb-btn[onclick^="zoomTo"]').forEach(b=>{
    const z = parseFloat(b.getAttribute('onclick')?.match(/zoomTo\(([^)]+)\)/)?.[1]);
    b.classList.toggle('active', z && Math.abs(z-scale)<.02);
  });
}

function zoomTo(z){ scale=z; applyTransform(); }

function resetView(){ scale=1; panX=40; panY=20; applyTransform(); }

function fitView(){
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  let maxX=0, maxY=0;
  for(const sk of SKILLS){
    const pos = LAYOUT[sk.key]; if(!pos) continue;
    const el = document.getElementById(`node-${sk.key}`);
    const w = el ? el.offsetWidth : 300;
    const h = el ? el.offsetHeight : 400;
    maxX = Math.max(maxX, pos.x + w + 60);
    maxY = Math.max(maxY, pos.y + h + 60);
  }
  scale = Math.min(ww/maxX, wh/maxY, 1.2);
  panX = (ww - maxX*scale)/2;
  panY = (wh - maxY*scale)/2;
  applyTransform();
}

wrap.addEventListener('wheel', e=>{
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const oldScale = scale;
  scale = Math.max(.15, Math.min(3, scale * (e.deltaY < 0 ? 1.08 : 1/1.08)));
  panX = mx - (mx - panX) * (scale / oldScale);
  panY = my - (my - panY) * (scale / oldScale);
  applyTransform();
}, {passive:false});

wrap.addEventListener('mousedown', e=>{
  if(e.target.closest('.node-section-head')) return;
  isDragging=true; dragStartX=e.clientX; dragStartY=e.clientY; panStartX=panX; panStartY=panY;
  wrap.classList.add('dragging');
});
window.addEventListener('mousemove', e=>{
  if(!isDragging) return;
  panX = panStartX + (e.clientX - dragStartX);
  panY = panStartY + (e.clientY - dragStartY);
  applyTransform();
});
window.addEventListener('mouseup', ()=>{ isDragging=false; wrap.classList.remove('dragging'); });

function toggleSection(el){
  const body = el.nextElementSibling;
  const arrow = el.querySelector('.arrow');
  const open = body.classList.toggle('open');
  arrow.classList.toggle('open', open);
  setTimeout(drawConnectors, 10);
}

function expandAll(){
  document.querySelectorAll('.node-section-body').forEach(b=>b.classList.add('open'));
  document.querySelectorAll('.arrow').forEach(a=>a.classList.add('open'));
  setTimeout(drawConnectors, 10);
}

function collapseAll(){
  document.querySelectorAll('.node-section-body').forEach(b=>b.classList.remove('open'));
  document.querySelectorAll('.arrow').forEach(a=>a.classList.remove('open'));
  setTimeout(drawConnectors, 10);
}

function renderNodes(){
  let html = '';

  html += `<div class="phase-label" style="left:60px;top:68px">主流水线 — Main Pipeline</div>`;
  html += `<div class="phase-label" style="left:60px;top:668px">辅助 / 迭代 — Auxiliary</div>`;

  for(const sk of SKILLS){
    const pos = LAYOUT[sk.key];
    if(!pos) continue;
    const w = NODE_W[sk.key] || 280;

    html += `<div class="node" id="node-${sk.key}" style="left:${pos.x}px;top:${pos.y}px;width:${w}px;border-color:${sk.color}40">`;
    html += `<div class="node-header">
      <div class="node-icon" style="background:${sk.color}18;color:${sk.color}">${sk.icon}</div>
      <div><div class="node-title" style="color:${sk.color}">${sk.label}</div>
      <div class="node-ver">${sk.name} · ${sk.version}</div></div>
    </div>`;
    html += `<div class="node-desc">${esc(sk.desc)}</div>`;

    // IO / Handoff
    html += `<div class="node-section">
      <div class="node-section-head" onclick="toggleSection(this)"><span class="arrow">▶</span> 输入 / 输出 / 交接 <span class="badge">${sk.handoffTo.length} 交接</span></div>
      <div class="node-section-body">
        <div style="margin-bottom:5px"><strong style="color:var(--cyan);font-size:10px">输入：</strong><span style="color:var(--muted)">${esc(sk.input)}</span></div>
        <div style="margin-bottom:5px"><strong style="color:var(--green);font-size:10px">输出：</strong><span style="color:var(--muted)">${esc(sk.output)}</span></div>
        <div style="margin-bottom:5px"><strong style="color:var(--muted);font-size:10px">跳过条件：</strong><span style="color:var(--muted)">${esc(sk.skipWhen)}</span></div>
        <div style="margin-bottom:3px"><strong style="color:var(--orange);font-size:10px">上游：</strong>${sk.handoffFrom.map(h=>`<span class="tag handoff">${esc(h)}</span>`).join('')}</div>
        <div><strong style="color:var(--orange);font-size:10px">下游：</strong>${sk.handoffTo.map(h=>`<span class="tag handoff">${esc(h)}</span>`).join('')}</div>
      </div>
    </div>`;

    // Tools
    if(sk.tools.length){
      html += `<div class="node-section">
        <div class="node-section-head" onclick="toggleSection(this)"><span class="arrow">▶</span> 工具调用 <span class="badge">${sk.tools.length}</span></div>
        <div class="node-section-body">${sk.tools.map(t=>`<span class="tag tool">🔧 ${esc(t)}</span>`).join(' ')}</div>
      </div>`;
    }

    // References
    if(sk.references.length){
      html += `<div class="node-section">
        <div class="node-section-head" onclick="toggleSection(this)"><span class="arrow">▶</span> References <span class="badge">${sk.references.length}</span></div>
        <div class="node-section-body">${sk.references.map(r=>
          `<div class="ref-row"><code>${esc(r.file)}</code>${r.exclusive?'<span class="exclusive"> 专属</span>':''}<br><span class="ref-note">${esc(r.note)}</span></div>`
        ).join('')}</div>
      </div>`;
    }

    // Models
    if(sk.models.length){
      html += `<div class="node-section">
        <div class="node-section-head" onclick="toggleSection(this)"><span class="arrow">▶</span> 模型路由 <span class="badge">${sk.models.length}</span></div>
        <div class="node-section-body">${sk.models.map(m=>
          `<div class="model-row"><span class="tag model">🤖 ${esc(m.model)}</span><span class="model-when">${esc(m.when)}</span></div>`
        ).join('')}</div>
      </div>`;
    }

    // Rules
    if(sk.rules.length){
      html += `<div class="node-section">
        <div class="node-section-head" onclick="toggleSection(this)"><span class="arrow">▶</span> 关键规则 <span class="badge">${sk.rules.length}</span></div>
        <div class="node-section-body">${sk.rules.map(r=>
          `<div class="rule-item"><span class="tag rule">📋</span> ${esc(r)}</div>`
        ).join('')}</div>
      </div>`;
    }

    // Prompt
    if(sk.prompt){
      html += `<div class="node-section">
        <div class="node-section-head" onclick="toggleSection(this)"><span class="arrow">▶</span> 核心 Prompt / 决策逻辑</div>
        <div class="node-section-body"><pre style="white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:10px;line-height:1.55;color:#dce8fb;max-height:200px;overflow:auto;margin:0">${esc(sk.prompt)}</pre></div>
      </div>`;
    }

    html += `</div>`;
  }
  canvas.innerHTML = html;
}

function getNodeRect(key){
  const el = document.getElementById(`node-${key}`);
  const pos = LAYOUT[key];
  if(!el || !pos) return null;
  return { x:pos.x, y:pos.y, w:el.offsetWidth, h:el.offsetHeight };
}

function drawConnectors(){
  let paths = '';

  function arrow(x1,y1,x2,y2,cls='main',dashed=false){
    const mx = (x1+x2)/2;
    const dash = dashed ? ' stroke-dasharray="6 4"' : '';
    paths += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${cls==='main'?'rgba(92,228,212,.4)':cls==='warn'?'rgba(240,160,80,.35)':'rgba(92,228,212,.25)'}" stroke-width="${cls==='main'?2.5:2}"${dash}/>`;
    const angle = Math.atan2(y2 - (y2+y1)/2, x2 - mx);
    const ax = x2 - 8*Math.cos(angle), ay = y2 - 8*Math.sin(angle);
    const lx = ax - 6*Math.cos(angle - .5), ly = ay - 6*Math.sin(angle - .5);
    const rx = ax - 6*Math.cos(angle + .5), ry = ay - 6*Math.sin(angle + .5);
    paths += `<polygon points="${x2},${y2} ${lx},${ly} ${rx},${ry}" fill="${cls==='main'?'rgba(92,228,212,.6)':cls==='warn'?'rgba(240,160,80,.5)':'rgba(92,228,212,.4)'}"/>`;
  }

  function vertArrow(x1,y1,x2,y2,cls='aux'){
    const my = (y1+y2)/2;
    const dashed = cls === 'warn';
    paths += `<path d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" fill="none" stroke="${cls==='warn'?'rgba(240,160,80,.3)':'rgba(92,228,212,.25)'}" stroke-width="2" ${dashed?'stroke-dasharray="6 4"':''}/>`;
    paths += `<polygon points="${x2},${y2} ${x2-4},${y2-8} ${x2+4},${y2-8}" fill="${cls==='warn'?'rgba(240,160,80,.45)':'rgba(92,228,212,.4)'}"/>`;
  }

  // Main pipeline: left-to-right
  for(let i=0; i<PIPELINE_ORDER.length-1; i++){
    const f = getNodeRect(PIPELINE_ORDER[i]), t = getNodeRect(PIPELINE_ORDER[i+1]);
    if(!f||!t) continue;
    arrow(f.x+f.w, f.y+30, t.x, t.y+30, 'main');
  }

  // modification -> generation (upstream feedback loop)
  const mod = getNodeRect('modification'), gen = getNodeRect('generation');
  if(mod && gen){
    vertArrow(mod.x + mod.w/2, mod.y, gen.x + gen.w/2, gen.y + gen.h, 'warn');
  }

  // modification -> assembly (re-assembly)
  const asm = getNodeRect('assembly');
  if(mod && asm){
    arrow(mod.x + mod.w, mod.y + 30, asm.x + asm.w/2, asm.y + asm.h, 'aux');
  }

  // modification -> brainstorm (upstream route, dashed)
  const bs = getNodeRect('brainstorm');
  if(mod && bs){
    const x1 = mod.x, y1 = mod.y + 30;
    const x2 = bs.x + bs.w/2, y2 = bs.y + bs.h;
    paths += `<path d="M${x1},${y1} C${x1-60},${y1} ${x2},${y2+50} ${x2},${y2}" fill="none" stroke="rgba(240,160,80,.25)" stroke-width="1.5" stroke-dasharray="6 4"/>`;
    paths += `<polygon points="${x2},${y2} ${x2-4},${y2+8} ${x2+4},${y2+8}" fill="rgba(240,160,80,.4)"/>`;
  }

  // assembly -> publishing
  const pub = getNodeRect('publishing');
  if(asm && pub){
    vertArrow(asm.x + asm.w/2 + 40, asm.y + asm.h, pub.x + pub.w/2, pub.y, 'aux');
  }

  svg.innerHTML = paths;
}

renderNodes();
setTimeout(()=>{ drawConnectors(); resetView(); }, 80);
window.addEventListener('resize', ()=>{ drawConnectors(); });
</script>
</body>
</html>
