  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;h3FormalDashboard&quot;&gt;

    &lt;section class=&quot;h3-summary-grid&quot; aria-label=&quot;运行摘要&quot;&gt;

      &lt;article class=&quot;card h3-summary-card h3-summary-alert&quot;&gt;
        &lt;span class=&quot;h3-summary-label&quot;&gt;严格静音&lt;/span&gt;

      &lt;article class=&quot;card h3-summary-card h3-summary-warn&quot;&gt;
        &lt;span class=&quot;h3-summary-label&quot;&gt;可判定边界&lt;/span&gt;

      &lt;div class=&quot;h3-decision-item&quot;&gt;&lt;span class=&quot;h3-dot h3-dot-alert&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;b&gt;音频角色会混合&lt;/b&gt;&lt;em&gt;RA-10 更接近源视频嵌入音轨&lt;/em&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;h3-decision-item&quot;&gt;&lt;span class=&quot;h3-dot h3-dot-neutral&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;b&gt;严格交付需后处理&lt;/b&gt;&lt;em&gt;删除/替换音轨后再做 PCM 验收&lt;/em&gt;&lt;/span&gt;&lt;/div&gt;

        &lt;div&gt;

          &lt;p&gt;每个点代表一条用例的平均值；越右表示与参考音频越相似，越上表示输出越响。相关性是诊断信号，不是质量分数。&lt;/p&gt;

        &lt;span&gt;&lt;i class=&quot;h3-legend-swatch h3-series-orange&quot;&gt;&lt;/i&gt;参考音频进入输出&lt;/span&gt;
        &lt;span&gt;&lt;i class=&quot;h3-legend-swatch h3-series-red&quot;&gt;&lt;/i&gt;静音/隔离失败&lt;/span&gt;
        &lt;span&gt;&lt;i class=&quot;h3-legend-swatch h3-series-purple&quot;&gt;&lt;/i&gt;角色冲突&lt;/span&gt;
        &lt;span&gt;&lt;i class=&quot;h3-legend-swatch h3-series-yellow&quot;&gt;&lt;/i&gt;证据待补&lt;/span&gt;
      &lt;/div&gt;

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;h3FormalDashboard&quot;);
  if (!root || typeof d3 === &quot;undefined&quot;) return;

  const cases = [
    { id: &quot;H3-RA-01&quot;, title: &quot;无参考基线&quot;, role: &quot;无参考音频&quot;, trials: [{ job: &quot;H3-RA-01__r1&quot;, corr: null, lufs: -14.8, peak: -0.9 }], kind: &quot;baseline&quot;, verdict: &quot;基线&quot;, note: &quot;默认生成有声视觉片段；用于和 RA-02 对照。&quot; },
    { id: &quot;H3-RA-02&quot;, title: &quot;参考人声但不声明用途&quot;, role: &quot;官方 8.516s 人声&quot;, trials: [{ job: &quot;H3-RA-02__r1__mimefix&quot;, corr: .8905, lufs: -22.8, peak: -7.3 }], kind: &quot;influence&quot;, verdict: &quot;参考音频进入输出&quot;, note: &quot;即使 Prompt 不声明用途，输出仍与官方参考人声高度相关。&quot; },
    { id: &quot;H3-RA-03&quot;, title: &quot;参考人声作为对白&quot;, role: &quot;15s 校准人声&quot;, trials: [{ job: &quot;H3-RA-03__r1&quot;, corr: .9653, lufs: -15.1, peak: -2.2 }], kind: &quot;influence&quot;, verdict: &quot;波形保留已证实&quot;, note: &quot;输出强烈保留参考人声；台词内容和顺序仍需 ASR。&quot; },
    { id: &quot;H3-RA-04&quot;, title: &quot;Prompt 请求静音&quot;, role: &quot;人声 + 静音要求&quot;, trials: [{ job: &quot;H3-RA-04__r1&quot;, corr: .9527, lufs: -15.2, peak: -2.8 }, { job: &quot;H3-RA-04__r2&quot;, corr: .9580, lufs: -14.9, peak: -2.3 }, { job: &quot;H3-RA-04__r3&quot;, corr: .9523, lufs: -14.9, peak: -2.5 }], kind: &quot;policy&quot;, verdict: &quot;静音失败 3/3&quot;, note: &quot;三次均生成 AAC 音轨并保留参考人声，不能作为严格静音交付。&quot; },
    { id: &quot;H3-RA-05&quot;, title: &quot;图片 + 人声口型驱动&quot;, role: &quot;人物图 + 15s 人声&quot;, trials: [{ job: &quot;H3-RA-05__r1&quot;, corr: .9802, lufs: -16.0, peak: -3.5 }, { job: &quot;H3-RA-05__r2&quot;, corr: .6291, lufs: -16.1, peak: -3.7 }, { job: &quot;H3-RA-05__r3&quot;, corr: .5039, lufs: -15.6, peak: -3.4 }], kind: &quot;evidence&quot;, verdict: &quot;口型证据不足&quot;, note: &quot;r1/r3 主脸和嘴部清晰，r2 有抱狗和更小嘴部；严格 250ms 尚未验证。&quot; },
    { id: &quot;H3-RA-06&quot;, title: &quot;只参考音色、生成新台词&quot;, role: &quot;15s 人声 + 新文本&quot;, trials: [{ job: &quot;H3-RA-06__r1&quot;, corr: -.0547, lufs: -14.5, peak: -2.7 }, { job: &quot;H3-RA-06__r2&quot;, corr: .1057, lufs: -15.1, peak: -2.8 }, { job: &quot;H3-RA-06__r3&quot;, corr: .0633, lufs: -14.0, peak: -2.4 }], kind: &quot;evidence&quot;, verdict: &quot;需 ASR/盲听&quot;, note: &quot;输出没有原样复制输入波形，但新台词和音色相似度不能由当前证据确认。&quot; },
    { id: &quot;H3-RA-07&quot;, title: &quot;click 只作画面时钟&quot;, role: &quot;15s click + 静音要求&quot;, trials: [{ job: &quot;H3-RA-07__r1&quot;, corr: .9501, lufs: -17.1, peak: -3.3 }, { job: &quot;H3-RA-07__r2&quot;, corr: .9468, lufs: -17.3, peak: -3.1 }, { job: &quot;H3-RA-07__r3&quot;, corr: .9332, lufs: -18.5, peak: -3.0 }], kind: &quot;policy&quot;, verdict: &quot;click 泄漏 3/3&quot;, note: &quot;视觉 montage 有节奏化分段，但 click 脉冲仍进入最终音轨。&quot; },
    { id: &quot;H3-RA-08&quot;, title: &quot;click 作可听节拍 + 画面时钟&quot;, role: &quot;15s click&quot;, trials: [{ job: &quot;H3-RA-08__r1&quot;, corr: .9428, lufs: -17.9, peak: -3.2 }], kind: &quot;influence&quot;, verdict: &quot;可听节拍可观察&quot;, note: &quot;输出保留 click-like 脉冲并伴随 montage 变化，不等于字节级透传。&quot; },
    { id: &quot;H3-RA-09&quot;, title: &quot;五个 marker 视觉事件&quot;, role: &quot;15s marker tones&quot;, trials: [{ job: &quot;H3-RA-09__r1&quot;, corr: .9624, lufs: -25.6, peak: -13.2 }, { job: &quot;H3-RA-09__r2&quot;, corr: .9260, lufs: -25.8, peak: -5.9 }, { job: &quot;H3-RA-09__r3&quot;, corr: .9392, lufs: -23.7, peak: -11.8 }], kind: &quot;policy&quot;, verdict: &quot;marker 泄漏 3/3&quot;, note: &quot;定点帧能看到主要纸飞机事件，但 marker tones 未被 Prompt 排除。&quot; },
    { id: &quot;H3-RA-10&quot;, title: &quot;带原音视频 + 独立人声&quot;, role: &quot;带音视频 + 15s 人声&quot;, trials: [{ job: &quot;H3-RA-10__r1&quot;, corr: .8075, secondary: .3684, lufs: -11.7, peak: -.8 }], kind: &quot;conflict&quot;, verdict: &quot;源音轨主导/混合&quot;, note: &quot;输出画面跟随人物参考，但音频更接近源视频嵌入音轨，而非独立人声。&quot; },
    { id: &quot;H3-RA-11&quot;, title: &quot;人声对白 + click 画面节奏&quot;, role: &quot;8s 人声 + 7s click&quot;, trials: [{ job: &quot;H3-RA-11__r1&quot;, corr: .6801, secondary: .7043, lag: &quot;8.0s&quot;, lufs: -17.4, peak: -2.0 }, { job: &quot;H3-RA-11__r2&quot;, corr: .6887, secondary: .1906, lag: &quot;2.0s&quot;, lufs: -20.0, peak: -1.8 }, { job: &quot;H3-RA-11__r3&quot;, corr: .9339, secondary: .8484, lag: &quot;9.0s&quot;, lufs: -19.2, peak: -2.2 }], kind: &quot;conflict&quot;, verdict: &quot;角色隔离不稳定&quot;, note: &quot;2/4/6s 附近可见构图变化，但三次都出现 0.5s 级 click 脉冲。&quot; },
    { id: &quot;H3-RA-12&quot;, title: &quot;8.516s 参考延展到 15s&quot;, role: &quot;官方 8.516s 人声&quot;, trials: [{ job: &quot;H3-RA-12__r1&quot;, corr: .8948, lufs: -22.8, peak: -6.9 }], kind: &quot;evidence&quot;, verdict: &quot;未发现明显循环&quot;, note: &quot;9.25s 后仍有动作，尾段约 -52dBFS；无 ASR 时不能确认无台词延续。&quot; }
  ];

  const series = { baseline: 1, influence: 2, policy: 3, conflict: 4, evidence: 5 };
  const labels = { baseline: &quot;基线&quot;, influence: &quot;参考音频进入输出&quot;, policy: &quot;静音/隔离失败&quot;, conflict: &quot;角色冲突&quot;, evidence: &quot;证据待补&quot; };
  const fmt = (value, digits = 2) =&gt; value === null || value === undefined ? &quot;—&quot; : Number(value).toFixed(digits);
  const average = (rows, key) =&gt; {
    const values = rows.map(d =&gt; d[key]).filter(v =&gt; v !== null &amp;&amp; v !== undefined);
    return values.length ? values.reduce((a, b) =&gt; a + b, 0) / values.length : null;
  };
  cases.forEach(d =&gt; {
    d.avgCorr = d.id === &quot;H3-RA-01&quot; ? null : average(d.trials, &quot;corr&quot;);
    d.avgLufs = average(d.trials, &quot;lufs&quot;);
    d.minCorr = d.id === &quot;H3-RA-01&quot; ? null : Math.min(...d.trials.map(t =&gt; t.corr));
    d.maxCorr = d.id === &quot;H3-RA-01&quot; ? null : Math.max(...d.trials.map(t =&gt; t.corr));
  });

  const body = root.querySelector(&quot;#h3ResultsBody&quot;);
  const detail = root.querySelector(&quot;#h3CaseDetail&quot;);
  const renderDetail = (item) =&gt; {
    const trialRows = item.trials.map((t, i) =&gt; `&lt;tr&gt;&lt;td&gt;r${i + 1}&lt;/td&gt;&lt;td&gt;${fmt(t.corr, 4)}&lt;/td&gt;&lt;td&gt;${fmt(t.lufs, 1)}&lt;/td&gt;&lt;td&gt;${fmt(t.peak, 1)}&lt;/td&gt;&lt;td&gt;${t.lag ? `click +${t.lag}` : &quot;&quot;}&lt;/td&gt;&lt;/tr&gt;`).join(&quot;&quot;);
    detail.innerHTML = `&lt;p class=&quot;h3-detail-kicker&quot;&gt;${item.id} / ${labels[item.kind]}&lt;/p&gt;
      &lt;h3&gt;${item.title}&lt;/h3&gt;
      &lt;p class=&quot;detail-summary&quot;&gt;输入角色：${item.role} · ${item.trials.length} 次有效试次&lt;/p&gt;
      &lt;div class=&quot;h3-detail-metrics&quot;&gt;&lt;div class=&quot;h3-detail-metric&quot;&gt;&lt;span&gt;平均相关性&lt;/span&gt;&lt;strong&gt;${fmt(item.avgCorr, 4)}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;h3-detail-metric&quot;&gt;&lt;span&gt;平均 LUFS&lt;/span&gt;&lt;strong&gt;${fmt(item.avgLufs, 1)}&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;h3-detail-metric&quot;&gt;&lt;span&gt;输出格式&lt;/span&gt;&lt;strong&gt;AAC / 32k&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;table class=&quot;h3-trial-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;试次&lt;/th&gt;&lt;th&gt;相关性&lt;/th&gt;&lt;th&gt;LUFS&lt;/th&gt;&lt;th&gt;峰值&lt;/th&gt;&lt;th&gt;备注&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${trialRows}&lt;/tbody&gt;&lt;/table&gt;
      &lt;p class=&quot;h3-detail-note&quot;&gt;${item.note}&lt;/p&gt;`;
  };
  body.innerHTML = cases.map((item, index) =&gt; `&lt;tr&gt;&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;h3-case-button&quot; data-case=&quot;${item.id}&quot; aria-pressed=&quot;${index === 0 ? &quot;true&quot; : &quot;false&quot;}&quot;&gt;${item.id}&lt;small&gt;${item.title}&lt;/small&gt;&lt;/button&gt;&lt;/td&gt;&lt;td&gt;${item.role}&lt;/td&gt;&lt;td&gt;${item.trials.length}&lt;/td&gt;&lt;td&gt;${fmt(item.avgCorr, 4)}&lt;/td&gt;&lt;td&gt;${fmt(item.avgLufs, 1)}&lt;/td&gt;&lt;td class=&quot;h3-verdict ${item.kind === &quot;policy&quot; || item.kind === &quot;conflict&quot; ? &quot;alert&quot; : item.kind === &quot;evidence&quot; ? &quot;warn&quot; : &quot;&quot;}&quot;&gt;${item.verdict}&lt;/td&gt;&lt;/tr&gt;`).join(&quot;&quot;);
  renderDetail(cases[0]);
  body.querySelectorAll(&quot;.h3-case-button&quot;).forEach(button =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; {
      body.querySelectorAll(&quot;.h3-case-button&quot;).forEach(node =&gt; node.setAttribute(&quot;aria-pressed&quot;, node === button ? &quot;true&quot; : &quot;false&quot;));
      const item = cases.find(d =&gt; d.id === button.dataset.case);
      if (item) renderDetail(item);
    });
  });

  const svg = d3.select(root.querySelector(&quot;#h3CorrelationChart&quot;));
  const tooltip = root.querySelector(&quot;#h3ChartTooltip&quot;);
  const drawChart = () =&gt; {
    const node = svg.node();
    const width = Math.max(320, node.parentNode.clientWidth);
    const height = width &lt; 520 ? 330 : 360;
    const margin = { top: 18, right: 42, bottom: 50, left: 64 };
    svg.attr(&quot;viewBox&quot;, `0 0 ${width} ${height}`).attr(&quot;height&quot;, height);
    svg.selectAll(&quot;*&quot;).remove();
    const points = cases.filter(d =&gt; d.avgCorr !== null);
    const corrExtent = d3.extent(points.flatMap(d =&gt; [d.minCorr, d.maxCorr]));
    const lufsExtent = d3.extent(points, d =&gt; d.avgLufs);
    const corrPad = Math.max(.05, (corrExtent[1] - corrExtent[0]) * .06);
    const lufsPad = Math.max(1.5, (lufsExtent[1] - lufsExtent[0]) * .12);
    const x = d3.scaleLinear().domain([Math.max(-1, corrExtent[0] - corrPad), Math.min(1, corrExtent[1] + corrPad)]).nice().range([margin.left, width - margin.right]);
    const y = d3.scaleLinear().domain([lufsExtent[0] - lufsPad, lufsExtent[1] + lufsPad]).nice().range([height - margin.bottom, margin.top]);
    const chart = svg.append(&quot;g&quot;);
    chart.append(&quot;rect&quot;).attr(&quot;class&quot;, &quot;chart-frame&quot;).attr(&quot;data-chart-frame&quot;, &quot;true&quot;).attr(&quot;x&quot;, margin.left).attr(&quot;y&quot;, margin.top).attr(&quot;width&quot;, width - margin.left - margin.right).attr(&quot;height&quot;, height - margin.top - margin.bottom);
    chart.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;grid&quot;).attr(&quot;transform&quot;, `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).ticks(width &lt; 520 ? 4 : 6).tickSize(-(height - margin.top - margin.bottom)).tickFormat(&quot;&quot;));
    chart.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;grid&quot;).attr(&quot;transform&quot;, `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-(width - margin.left - margin.right)).tickFormat(&quot;&quot;));
    chart.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;axis&quot;).attr(&quot;transform&quot;, `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).ticks(width &lt; 520 ? 4 : 6).tickFormat(d3.format(&quot;.1f&quot;)));
    chart.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;axis&quot;).attr(&quot;transform&quot;, `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(d =&gt; `${d} LUFS`));
    chart.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;axis-title&quot;).attr(&quot;data-axis&quot;, &quot;x&quot;).attr(&quot;x&quot;, (margin.left + width - margin.right) / 2).attr(&quot;y&quot;, height - 9).attr(&quot;text-anchor&quot;, &quot;middle&quot;).text(&quot;参考音频相关性&quot;);
    chart.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;axis-title&quot;).attr(&quot;data-axis&quot;, &quot;y&quot;).attr(&quot;transform&quot;, `translate(15 ${(margin.top + height - margin.bottom) / 2}) rotate(-90)`).attr(&quot;text-anchor&quot;, &quot;middle&quot;).text(&quot;输出响度（LUFS）&quot;);
    const marks = chart.append(&quot;g&quot;).selectAll(&quot;g.case-mark&quot;).data(points, d =&gt; d.id).join(&quot;g&quot;).attr(&quot;class&quot;, &quot;case-mark&quot;).attr(&quot;transform&quot;, d =&gt; `translate(${x(d.avgCorr)},${y(d.avgLufs)})`);
    marks.append(&quot;line&quot;).attr(&quot;class&quot;, &quot;error-line&quot;).attr(&quot;x1&quot;, d =&gt; x(d.minCorr) - x(d.avgCorr)).attr(&quot;x2&quot;, d =&gt; x(d.maxCorr) - x(d.avgCorr)).attr(&quot;y1&quot;, 0).attr(&quot;y2&quot;, 0);
    marks.append(&quot;circle&quot;).attr(&quot;class&quot;, &quot;case-point&quot;).attr(&quot;r&quot;, 7).attr(&quot;fill&quot;, d =&gt; `var(--viz-series-${series[d.kind]})`);
    marks.append(&quot;circle&quot;).attr(&quot;class&quot;, &quot;case-hit&quot;).attr(&quot;data-chart-hit&quot;, &quot;true&quot;).attr(&quot;r&quot;, 16).on(&quot;mouseenter&quot;, (event, d) =&gt; {
      tooltip.innerHTML = `&lt;strong&gt;${d.id} · ${d.title}&lt;/strong&gt;&lt;span&gt;相关性 ${fmt(d.avgCorr, 4)} · ${fmt(d.avgLufs, 1)} LUFS&lt;/span&gt;&lt;span&gt;${d.verdict}&lt;/span&gt;`;
      tooltip.style.display = &quot;block&quot;;
      const rect = root.querySelector(&quot;#h3CorrelationChart&quot;).getBoundingClientRect();
      const rootRect = root.getBoundingClientRect();
      tooltip.style.left = `${Math.min(width - 220, Math.max(8, event.clientX - rect.left + 12))}px`;
      tooltip.style.top = `${Math.max(8, event.clientY - rootRect.top - 42)}px`;
      tooltip.setAttribute(&quot;aria-hidden&quot;, &quot;false&quot;);
    }).on(&quot;mouseleave&quot;, () =&gt; { tooltip.style.display = &quot;none&quot;; tooltip.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;); }).on(&quot;click&quot;, (event, d) =&gt; {
      const button = body.querySelector(`[data-case=&quot;${d.id}&quot;]`);
      if (button) button.click();
    });
    const labelY = { &quot;H3-RA-02&quot;: -8, &quot;H3-RA-03&quot;: -8, &quot;H3-RA-04&quot;: 12, &quot;H3-RA-07&quot;: -8, &quot;H3-RA-08&quot;: 12, &quot;H3-RA-12&quot;: 12 };
    const compactLabels = new Set([&quot;H3-RA-04&quot;, &quot;H3-RA-06&quot;, &quot;H3-RA-09&quot;, &quot;H3-RA-10&quot;, &quot;H3-RA-11&quot;]);
    const labelMarks = width &lt; 520 ? marks.filter(d =&gt; compactLabels.has(d.id)) : marks;
    const leftThreshold = width &lt; 520 ? .72 : .84;
    labelMarks.append(&quot;text&quot;).attr(&quot;class&quot;, &quot;case-label&quot;)
      .attr(&quot;x&quot;, d =&gt; d.avgCorr &gt; leftThreshold ? -10 : 10)

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;

  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }

    activeTrigger = null;
    tooltip?.remove();

    }

    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {

              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }

  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
