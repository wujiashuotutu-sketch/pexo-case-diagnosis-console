:root[data-theme=&quot;light&quot;] {

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  padding: 5px;

  background: transparent !important;

  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;

h2,
h3,
h4,
h5,
h6,

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {

}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);

  font-family: var(--font-mono);

  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;

}

.table-responsive {

  overflow-x: auto;

}

.table {

  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);

  line-height: var(--line-height-small);

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;

.btn,

.btn {

  min-height: 28px;
  align-items: center;

a.btn {

  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary:not(:disabled):hover {

  opacity: 0.4;

[data-lucide] {

.form-label {

  margin-bottom: 6px;
  color: var(--foreground);
}

  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control:focus-visible {

.form-control:disabled,
.form-select:disabled {

  opacity: 0.4;

  width: 100%;
  min-height: 28px;
  margin: 0;

  border: 1px solid var(--input);

  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;h3TestDesignDashboard&quot;&gt;
  &lt;main class=&quot;h3-shell&quot;&gt;
    &lt;header class=&quot;h3-header h3-command-header&quot;&gt;
      &lt;div&gt;
        &lt;p class=&quot;text-small text-muted h3-eyebrow&quot;&gt;MINIMAX H3 · 参考音频 · 24 个正式试次&lt;/p&gt;
        &lt;h1&gt;结论、测试物料与核心用例&lt;/h1&gt;
        &lt;p class=&quot;text-muted&quot;&gt;这套测试只看 H3 自己会怎么做；生成后再剪辑或替换声音，另算一层能力。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;h3-header-side&quot;&gt;
        &lt;div class=&quot;h3-wave-card&quot; aria-label=&quot;声音输入和输出的测试信号示意&quot;&gt;
          &lt;div class=&quot;h3-wave-top&quot;&gt;&lt;span class=&quot;text-small&quot;&gt;声音控制测试&lt;/span&gt;&lt;strong&gt;24 次&lt;/strong&gt;&lt;/div&gt;
          &lt;div class=&quot;h3-waveform&quot; aria-hidden=&quot;true&quot;&gt;&lt;i style=&quot;height:28%&quot;&gt;&lt;/i&gt;&lt;i style=&quot;height:52%&quot;&gt;&lt;/i&gt;&lt;i style=&quot;height:40%&quot;&gt;&lt;/i&gt;&lt;i style=&quot;height:78%&quot;&gt;&lt;/i&gt;&lt;i style=&quot;height:62%&quot;&gt;&lt;/i&gt;&lt;i style=&quot;height:92%&quot;&gt;&lt;/i&gt;&lt;i style=&quot;height:44%&quot;&gt;&lt;/i&gt;&lt;i style=&quot;height:70%&quot;&gt;&lt;/i&gt;&lt;i style=&quot;height:34%&quot;&gt;&lt;/i&gt;&lt;i style=&quot;height:84%&quot;&gt;&lt;/i&gt;&lt;i style=&quot;height:58%&quot;&gt;&lt;/i&gt;&lt;i style=&quot;height:46%&quot;&gt;&lt;/i&gt;&lt;i style=&quot;height:76%&quot;&gt;&lt;/i&gt;&lt;i style=&quot;height:38%&quot;&gt;&lt;/i&gt;&lt;i style=&quot;height:88%&quot;&gt;&lt;/i&gt;&lt;i style=&quot;height:54%&quot;&gt;&lt;/i&gt;&lt;/div&gt;
          &lt;div class=&quot;h3-wave-foot&quot;&gt;&lt;span&gt;输入参考音频&lt;/span&gt;&lt;span&gt;观察最终声音&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;span class=&quot;viz-badge&quot;&gt;2026-08-14 正式结果&lt;/span&gt;
      &lt;/div&gt;
    &lt;/header&gt;

    &lt;section class=&quot;h3-control-map&quot; aria-labelledby=&quot;h3ControlMapTitle&quot;&gt;
      &lt;div class=&quot;h3-control-map-copy&quot;&gt;
        &lt;span class=&quot;h3-kicker&quot;&gt;CONTROL MAP&lt;/span&gt;
        &lt;h2 id=&quot;h3ControlMapTitle&quot;&gt;参考音频能影响什么？&lt;/h2&gt;
        &lt;p class=&quot;text-muted&quot;&gt;一眼看懂当前已经观察到的能力，以及不能交给提示词保证的部分。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;h3-control-grid&quot;&gt;
        &lt;div class=&quot;h3-control-row h3-control-row-fail&quot;&gt;
          &lt;div class=&quot;h3-control-name&quot;&gt;&lt;span class=&quot;h3-control-dot&quot;&gt;&lt;/span&gt;&lt;b&gt;关闭最终声音&lt;/b&gt;&lt;/div&gt;
          &lt;div class=&quot;h3-control-signal&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;span class=&quot;h3-control-status&quot;&gt;不稳定&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;h3-control-row h3-control-row-pass&quot;&gt;
          &lt;div class=&quot;h3-control-name&quot;&gt;&lt;span class=&quot;h3-control-dot&quot;&gt;&lt;/span&gt;&lt;b&gt;带动画和画面节奏&lt;/b&gt;&lt;/div&gt;
          &lt;div class=&quot;h3-control-signal&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;span class=&quot;h3-control-status&quot;&gt;能观察到&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;h3-control-row h3-control-row-warn&quot;&gt;
          &lt;div class=&quot;h3-control-name&quot;&gt;&lt;span class=&quot;h3-control-dot&quot;&gt;&lt;/span&gt;&lt;b&gt;把多条声音分开&lt;/b&gt;&lt;/div&gt;
          &lt;div class=&quot;h3-control-signal&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;span class=&quot;h3-control-status&quot;&gt;容易混入&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section aria-labelledby=&quot;h3ConclusionTitle&quot;&gt;
      &lt;div class=&quot;h3-section-heading&quot;&gt;
        &lt;div&gt;
          &lt;h2 id=&quot;h3ConclusionTitle&quot;&gt;结论&lt;/h2&gt;
          &lt;p class=&quot;text-muted&quot;&gt;可以上传参考音频，但文字提示不能稳定控制“要不要出声”，也不能把不同声音可靠分开。&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;viz-grid h3-stat-grid&quot;&gt;
        &lt;article class=&quot;card viz-stat&quot;&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;H3 自带的声音开关&lt;/span&gt;
          &lt;strong class=&quot;viz-stat-value&quot;&gt;未确认&lt;/strong&gt;
          &lt;span class=&quot;text-small&quot;&gt;文档里没有明确的 &lt;code&gt;sound/audio/mute&lt;/code&gt; 开关&lt;/span&gt;
          &lt;div class=&quot;h3-stat-meter h3-meter-neutral&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;card viz-stat&quot;&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;想静音或分开声音&lt;/span&gt;
          &lt;strong class=&quot;viz-stat-value text-destructive&quot;&gt;0 / 9&lt;/strong&gt;
          &lt;span class=&quot;text-small&quot;&gt;人声、节拍声、定时提示音都曾漏进输出&lt;/span&gt;
          &lt;div class=&quot;h3-stat-meter h3-meter-fail&quot; aria-label=&quot;静音和分离要求 0 / 9&quot;&gt;&lt;span style=&quot;width: 0%&quot;&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;card viz-stat&quot;&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;正式任务&lt;/span&gt;
          &lt;strong class=&quot;viz-stat-value&quot;&gt;24 / 24&lt;/strong&gt;
          &lt;span class=&quot;text-small&quot;&gt;都成功生成，文件也能正常播放&lt;/span&gt;
          &lt;div class=&quot;h3-stat-meter h3-meter-pass&quot; aria-label=&quot;正式任务 24 / 24&quot;&gt;&lt;span style=&quot;width: 100%&quot;&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;card viz-stat&quot;&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;仍缺证据&lt;/span&gt;
          &lt;strong class=&quot;viz-stat-value&quot;&gt;3 类&lt;/strong&gt;
          &lt;span class=&quot;text-small&quot;&gt;逐字对齐、听感音色、250ms 嘴型同步&lt;/span&gt;
          &lt;div class=&quot;h3-stat-meter h3-meter-warn&quot; aria-label=&quot;仍缺 3 类证据&quot;&gt;&lt;span style=&quot;width: 42%&quot;&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;/article&gt;
      &lt;/div&gt;
      &lt;div class=&quot;h3-decision-list&quot;&gt;
        &lt;div&gt;&lt;span class=&quot;h3-decision-mark h3-fail-mark&quot;&gt;&lt;/span&gt;&lt;b&gt;不能可靠关闭声音&lt;/b&gt;&lt;span class=&quot;text-muted&quot;&gt;提示词写“静音”时，参考人声、节拍声和定时提示音仍可能进入最终音轨。&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;span class=&quot;h3-decision-mark h3-fail-mark&quot;&gt;&lt;/span&gt;&lt;b&gt;不能可靠分开不同声音&lt;/b&gt;&lt;span class=&quot;text-muted&quot;&gt;带原音视频时，输出更像原视频的声音；同时给两条参考音频也会互相混入。&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;span class=&quot;h3-decision-mark h3-pass-mark&quot;&gt;&lt;/span&gt;&lt;b&gt;参考音频确实会影响画面和声音&lt;/b&gt;&lt;span class=&quot;text-muted&quot;&gt;对白的声音形状、节拍、画面分段和事件线索都能看到变化。&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;span class=&quot;h3-decision-mark h3-neutral-mark&quot;&gt;&lt;/span&gt;&lt;b&gt;交付前要再处理声音&lt;/b&gt;&lt;span class=&quot;text-muted&quot;&gt;如果必须静音或使用指定外部音轨，需要删除/替换 H3 音轨，再检查每一段声音。&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section aria-labelledby=&quot;h3FormationTitle&quot;&gt;
      &lt;div class=&quot;h3-section-heading&quot;&gt;
        &lt;div&gt;
          &lt;h2 id=&quot;h3FormationTitle&quot;&gt;用例的测试方向怎么形成&lt;/h2&gt;
          &lt;p class=&quot;text-muted&quot;&gt;先从用户真正想控制的事情出发，再用固定物料一次只验证一个问题。&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;h3-flow&quot; aria-label=&quot;测试方向形成流程&quot;&gt;
        &lt;div class=&quot;h3-flow-step&quot;&gt;
          &lt;span class=&quot;h3-flow-index&quot;&gt;01&lt;/span&gt;
          &lt;b&gt;用户想控制什么&lt;/b&gt;
          &lt;p&gt;能不能关掉声音？&lt;br&gt;&lt;code&gt;audio_url&lt;/code&gt; 能不能只带动画、不带进最终声音？&lt;br&gt;能不能分别控制嘴型、节拍和音色？&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;h3-flow-step&quot;&gt;
          &lt;span class=&quot;h3-flow-index&quot;&gt;02&lt;/span&gt;
          &lt;b&gt;先看 H3 接受什么&lt;/b&gt;
          &lt;p&gt;核心集只测文档里明确的 &lt;code&gt;reference_audio&lt;/code&gt;；没写明的字段，单独测试接口会不会拒绝。&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;h3-flow-step&quot;&gt;
          &lt;span class=&quot;h3-flow-index&quot;&gt;03&lt;/span&gt;
          &lt;b&gt;只改一个条件&lt;/b&gt;
          &lt;p&gt;无参考基线、已知台词和停顿、固定节拍和定时提示音、带原音视频、短音频延展。&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;h3-flow-step&quot;&gt;
          &lt;span class=&quot;h3-flow-index&quot;&gt;04&lt;/span&gt;
          &lt;b&gt;合并成一套核心测试&lt;/b&gt;
          &lt;p&gt;把 64 条探索组合去重成 12 条核心用例；静音、嘴型和多声音混入这三类高风险问题各重复 3 次。&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;table-responsive h3-direction-table-wrap&quot;&gt;
        &lt;table class=&quot;table table-sm h3-direction-table&quot;&gt;
          &lt;caption class=&quot;sr-only&quot;&gt;六个测试方向与核心用例映射&lt;/caption&gt;
          &lt;thead&gt;
            &lt;tr&gt;&lt;th&gt;测试方向&lt;/th&gt;&lt;th&gt;为什么这样测&lt;/th&gt;&lt;th&gt;怎么保证公平&lt;/th&gt;&lt;th&gt;核心用例&lt;/th&gt;&lt;th&gt;结果&lt;/th&gt;&lt;/tr&gt;
          &lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;默认解释&lt;/b&gt;&lt;/td&gt;&lt;td&gt;先确认加上 &lt;code&gt;audio_url&lt;/code&gt; 后，H3 会不会改变声音&lt;/td&gt;&lt;td&gt;同一视觉提示词，成对比较有/无参考音频&lt;/td&gt;&lt;td&gt;&lt;code&gt;RA-01 / 02&lt;/code&gt;&lt;/td&gt;&lt;td&gt;参考音频不是被动附件&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;对白与静音&lt;/b&gt;&lt;/td&gt;&lt;td&gt;看提示词能不能指定“使用”或“忽略”声音&lt;/td&gt;&lt;td&gt;同一段 15 秒人声，只反转文字要求&lt;/td&gt;&lt;td&gt;&lt;code&gt;RA-03 / 04&lt;/code&gt;&lt;/td&gt;&lt;td class=&quot;text-destructive&quot;&gt;3 次都没静音&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;嘴型与音色&lt;/b&gt;&lt;/td&gt;&lt;td&gt;把“照着说、嘴型同步、像同一个人”分开验证&lt;/td&gt;&lt;td&gt;同一段人声，分别要求跟读和说新台词&lt;/td&gt;&lt;td&gt;&lt;code&gt;RA-05 / 06&lt;/code&gt;&lt;/td&gt;&lt;td&gt;还需要语音转文字、听感对比和逐帧检查&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;节奏与事件&lt;/b&gt;&lt;/td&gt;&lt;td&gt;看音频能不能只用来卡画面时间，而不出现在成片声音里&lt;/td&gt;&lt;td&gt;固定 120 BPM 节拍声和五个定时提示音&lt;/td&gt;&lt;td&gt;&lt;code&gt;RA-07 / 08 / 09&lt;/code&gt;&lt;/td&gt;&lt;td class=&quot;text-destructive&quot;&gt;能带动画，但没能把声音隔开&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;多来源声音&lt;/b&gt;&lt;/td&gt;&lt;td&gt;现实请求可能同时带视频原音和多条参考音频&lt;/td&gt;&lt;td&gt;比较源视频声音、独立人声和节拍声谁更像输出&lt;/td&gt;&lt;td&gt;&lt;code&gt;RA-10 / 11&lt;/code&gt;&lt;/td&gt;&lt;td class=&quot;text-destructive&quot;&gt;每条声音的用途不稳定&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;b&gt;时长延展&lt;/b&gt;&lt;/td&gt;&lt;td&gt;参考音频经常比目标视频短&lt;/td&gt;&lt;td&gt;用 8.516 秒人声生成 15 秒视频&lt;/td&gt;&lt;td&gt;&lt;code&gt;RA-12&lt;/code&gt;&lt;/td&gt;&lt;td&gt;暂时没看到明显循环，还要补语音转文字检查&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section aria-labelledby=&quot;h3MaterialsTitle&quot;&gt;
      &lt;div class=&quot;h3-section-heading&quot;&gt;
        &lt;div&gt;
          &lt;h2 id=&quot;h3MaterialsTitle&quot;&gt;核心测试物料&lt;/h2&gt;
          &lt;p class=&quot;text-muted&quot;&gt;8 份正式输入物料都有固定文件信息；固定音频用来校准时间，生成出来的声音不拿来当时间标准。&lt;/p&gt;
        &lt;/div&gt;
        &lt;span class=&quot;viz-badge&quot;&gt;物料包含 10 个输入媒体 + 6 份规范&lt;/span&gt;
      &lt;/div&gt;

      &lt;div class=&quot;h3-timeline-grid&quot;&gt;
        &lt;div class=&quot;h3-fixture&quot;&gt;
          &lt;div class=&quot;h3-fixture-head&quot;&gt;&lt;b&gt;15s 校准人声&lt;/b&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;三句已知台词&lt;/span&gt;&lt;/div&gt;

  &lt;/tr&gt;`).join(&quot;&quot;);

  renderDetail(cases[0]);
  body.querySelectorAll(&quot;button[data-case]&quot;).forEach(button =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; {
      body.querySelectorAll(&quot;button[data-case]&quot;).forEach(node =&gt; node.setAttribute(&quot;aria-pressed&quot;, node === button ? &quot;true&quot; : &quot;false&quot;));
      const item = cases.find(candidate =&gt; candidate.id === button.dataset.case);

    });
  });
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
